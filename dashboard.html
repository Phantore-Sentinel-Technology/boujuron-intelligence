<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phantore Sentinel Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: #fff;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
        }

        /* Cards */
        .card-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            flex: 1;
            padding: 20px;
            background: #1e293b;
            border-radius: 10px;
            text-align: center;
        }

        /* Filters */
        .filters {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }

        input, select {
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        /* Table */
        table {
            width: 100%;
            background: #1e293b;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
        }

        th {
            background: #334155;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .high { background: #7f1d1d; }
        .medium { background: #78350f; }
        .low { background: #14532d; }

        /* Charts */
        .chart-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        canvas {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>🚨 Phantore Sentinel Dashboard</h1>

<!-- FILTERS -->
<div class="filters">
    <input type="text" id="userFilter" placeholder="Filter by User ID">
    <select id="riskFilter">
        <option value="">All Risk</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="LOW">LOW</option>
    </select>
</div>

<!-- STATS -->
<div class="card-container">
    <div class="card"><h2 id="total">0</h2><p>Total</p></div>
    <div class="card"><h2 id="high">0</h2><p>High</p></div>
    <div class="card"><h2 id="medium">0</h2><p>Medium</p></div>
    <div class="card"><h2 id="low">0</h2><p>Low</p></div>
</div>

<!-- TABLE -->
<table>
    <thead>
    <tr>
        <th>User</th>
        <th>Reason</th>
        <th>Score</th>
        <th>Risk</th>
        <th>Time</th>
    </tr>
    </thead>
    <tbody id="table-body"></tbody>
</table>

<!-- CHARTS -->
<div class="chart-container">
    <canvas id="riskChart"></canvas>
    <canvas id="trendChart"></canvas>
</div>

<script>
    const API_URL = "http://localhost:8001/fraud-alerts";

    let riskChart, trendChart;
    let allData = [];

    /* BADGE */
    function badge(level) {
        return `<span class="badge ${level.toLowerCase()}">${level}</span>`;
    }

    /* FILTER */
    function applyFilters(data) {
        const user = document.getElementById("userFilter").value;
        const risk = document.getElementById("riskFilter").value;

        return data.filter(a => {
            return (!user || a.user_id.includes(user)) &&
                (!risk || a.risk_level === risk);
        });
    }

    /* UPDATE UI */
    function render(data) {
        const table = document.getElementById("table-body");
        table.innerHTML = "";

        let high=0, medium=0, low=0;

        data.forEach(a => {
            if (a.risk_level === "HIGH") high++;
            else if (a.risk_level === "MEDIUM") medium++;
            else low++;

            table.innerHTML += `
      <tr>
        <td>${a.user_id}</td>
        <td>${a.reason}</td>
        <td>${a.risk_score}</td>
        <td>${badge(a.risk_level)}</td>
        <td>${a.timestamp}</td>
      </tr>
    `;
        });

        document.getElementById("total").innerText = data.length;
        document.getElementById("high").innerText = high;
        document.getElementById("medium").innerText = medium;
        document.getElementById("low").innerText = low;

        updateCharts(data, high, medium, low);
    }

    /* CHARTS */
    function updateCharts(data, high, medium, low) {

        // Risk Pie
        if (riskChart) riskChart.destroy();
        riskChart = new Chart(document.getElementById("riskChart"), {
            type: "pie",
            data: {
                labels: ["High", "Medium", "Low"],
                datasets: [{
                    data: [high, medium, low]
                }]
            }
        });

        // Trend (alerts over time)
        const counts = {};
        data.forEach(a => {
            const time = a.timestamp.slice(11,16);
            counts[time] = (counts[time] || 0) + 1;
        });

        if (trendChart) trendChart.destroy();
        trendChart = new Chart(document.getElementById("trendChart"), {
            type: "line",
            data: {
                labels: Object.keys(counts),
                datasets: [{
                    label: "Fraud Events",
                    data: Object.values(counts)
                }]
            }
        });
    }

    /* FETCH */
    async function load() {
        const res = await fetch(API_URL);
        allData = await res.json();
        render(applyFilters(allData));
    }

    /* FILTER EVENTS */
    document.getElementById("userFilter").addEventListener("input", () => {
        render(applyFilters(allData));
    });

    document.getElementById("riskFilter").addEventListener("change", () => {
        render(applyFilters(allData));
    });

    /* WEBSOCKET (REAL-TIME) */
    const ws = new WebSocket("ws://localhost:8001/ws/fraud");

    ws.onmessage = (event) => {
        const newAlert = JSON.parse(event.data);
        allData.unshift(newAlert);
        render(applyFilters(allData));
    };

    /* INIT */ //impl
    load();
    setInterval(load, 5000); // fallback refresh
</script>

</body>
</html>
