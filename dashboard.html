<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boujuron Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                    radial-gradient(circle at top left, #1e293b 0%, #0f172a 45%),
                    radial-gradient(circle at bottom right, #111827 0%, #020617 50%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 30px;
        }

        /* =========================
           HEADER
        ========================= */

        h1 {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 35px;
            color: #e2e8f0;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        /* =========================
           FILTERS
        ========================= */

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        input,
        select {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #f8fafc;
            padding: 12px 14px;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            min-width: 220px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }

        /* =========================
           STAT CARDS
        ========================= */

        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 18px;
            padding: 25px;
            backdrop-filter: blur(14px);
            transition: transform 0.25s ease,
            box-shadow 0.25s ease,
            border 0.25s ease;
            box-shadow:
                    0 8px 24px rgba(0, 0, 0, 0.25),
                    inset 0 1px 1px rgba(255,255,255,0.04);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.35);
            box-shadow:
                    0 12px 30px rgba(0,0,0,0.35),
                    0 0 20px rgba(56, 189, 248, 0.15);
        }

        .card h2 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        .card p {
            color: #cbd5e1;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        /* =========================
           TABLE
        ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(14px);
            box-shadow:
                    0 10px 25px rgba(0,0,0,0.25);
        }

        thead {
            background: rgba(30, 41, 59, 0.95);
        }

        th {
            text-align: left;
            padding: 16px;
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 1px solid rgba(148,163,184,0.15);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid rgba(148,163,184,0.08);
            color: #e2e8f0;
            font-size: 14px;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(30, 41, 59, 0.55);
        }

        /* =========================
           BADGES
        ========================= */

        .badge {
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-block;
            text-align: center;
            min-width: 85px;
        }

        .high {
            background: rgba(239, 68, 68, 0.18);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .medium {
            background: rgba(245, 158, 11, 0.18);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .low {
            background: rgba(34, 197, 94, 0.18);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.35);
        }

        /* =========================
           CHARTS
        ========================= */

        .chart-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        canvas {
            width: 100% !important;
            height: 350px !important;

            background: rgba(15, 23, 42, 0.78);

            border: 1px solid rgba(148, 163, 184, 0.15);

            padding: 20px;

            border-radius: 18px;

            backdrop-filter: blur(14px);

            box-shadow:
                    0 10px 25px rgba(0,0,0,0.25);
        }

        /* =========================
           SCROLLBAR
        ========================= */

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 20px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 768px) {

            body {
                padding: 18px;
            }

            h1 {
                font-size: 1.8rem;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            input,
            select {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<h1>🚨 Boujuron Dashboard </h1>

<!-- FILTERS -->
<div class="filters">
    <input type="text" id="userFilter" placeholder="Filter by User ID">
    <select id="riskFilter">
        <option value="">All Risk</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="LOW">LOW</option>
    </select>
</div>

<!-- STATS -->
<div class="card-container">
    <div class="card"><h2 id="total">0</h2><p>Total</p></div>
    <div class="card"><h2 id="high">0</h2><p>High</p></div>
    <div class="card"><h2 id="medium">0</h2><p>Medium</p></div>
    <div class="card"><h2 id="low">0</h2><p>Low</p></div>
</div>

<!-- TABLE -->
<table>
    <thead>
    <tr>
        <th>User</th>
        <th>Reason</th>
        <th>Score</th>
        <th>Risk</th>
        <th>Time</th>
    </tr>
    </thead>
    <tbody id="table-body"></tbody>
</table>

<!-- CHARTS -->
<div class="chart-container">
    <canvas id="riskChart"></canvas>
    <canvas id="trendChart"></canvas>
</div>

<script>
    const API_URL = "http://localhost:8002/fraud-alerts";

    let riskChart, trendChart;
    let allData = [];

    /* BADGE */
    function badge(level) {
        return `<span class="badge ${level.toLowerCase()}">${level}</span>`;
    }

    /* FILTER */
    function applyFilters(data) {
        const user = document.getElementById("userFilter").value;
        const risk = document.getElementById("riskFilter").value;

        return data.filter(a => {
            return (!user || a.user_id.includes(user)) &&
                (!risk || a.risk_level === risk);
        });
    }

    /* UPDATE UI */
    function render(data) {
        const table = document.getElementById("table-body");
        table.innerHTML = "";

        let high=0, medium=0, low=0;

        data.forEach(a => {
            if (a.risk_level === "HIGH") high++;
            else if (a.risk_level === "MEDIUM") medium++;
            else low++;

            table.innerHTML += `
      <tr>
        <td>${a.user_id}</td>
        <td>${a.reason}</td>
        <td>${a.risk_score}</td>
        <td>${badge(a.risk_level)}</td>
        <td>${a.timestamp}</td>
      </tr>
    `;
        });

        document.getElementById("total").innerText = data.length;
        document.getElementById("high").innerText = high;
        document.getElementById("medium").innerText = medium;
        document.getElementById("low").innerText = low;

        updateCharts(data, high, medium, low);
    }

    /* CHARTS */
function updateCharts(data, high, medium, low) {

// Destroy old charts
if (riskChart) riskChart.destroy();
if (trendChart) trendChart.destroy();

// =========================
// RISK DONUT CHART
// =========================

riskChart = new Chart(document.getElementById("riskChart"), {
    type: "doughnut",

    data: {
        labels: ["High", "Medium", "Low"],

        datasets: [{
            data: [high, medium, low],

            backgroundColor: [
                "#ef4444", // red
                "#f59e0b", // amber
                "#22c55e"  // green
            ],

            borderColor: "#0f172a",
            borderWidth: 4,
            hoverOffset: 10
        }]
    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        cutout: "72%",

        plugins: {

            legend: {
                position: "top",

                labels: {
                    color: "#cbd5e1",
                    padding: 20,
                    font: {
                        size: 13
                    }
                }
            },

            title: {
                display: true,
                text: "Risk Distribution",
                color: "#f8fafc",
                font: {
                    size: 18,
                    weight: "bold"
                },
                padding: {
                    bottom: 20
                }
            }
        }
    }
});

// =========================
// TREND LINE CHART
// =========================

const counts = {};

data.forEach(a => {
    const time = a.timestamp.slice(11,16);
    counts[time] = (counts[time] || 0) + 1;
});

trendChart = new Chart(document.getElementById("trendChart"), {

    type: "line",

    data: {
        labels: Object.keys(counts),

        datasets: [{
            label: "Fraud Events",
            data: Object.values(counts),

            borderColor: "#38bdf8",
            backgroundColor: "rgba(56, 189, 248, 0.15)",

            tension: 0.4,

            fill: true,

            pointRadius: 5,

            pointBackgroundColor: "#38bdf8"
        }]
    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

            legend: {
                labels: {
                    color: "#cbd5e1"
                }
            },

            title: {
                display: true,
                text: "Fraud Activity Timeline",
                color: "#f8fafc",
                font: {
                    size: 18,
                    weight: "bold"
                }
            }
        },

        scales: {

            x: {
                ticks: {
                    color: "#94a3b8"
                },

                grid: {
                    color: "rgba(148,163,184,0.08)"
                }
            },

            y: {
                ticks: {
                    color: "#94a3b8"
                },

                grid: {
                    color: "rgba(148,163,184,0.08)"
                }
            }
        }
    }
});
}

    /* FETCH */
    async function load() {
        const res = await fetch(API_URL);
        allData = await res.json();
        render(applyFilters(allData));
    }

    /* FILTER EVENTS */
    document.getElementById("userFilter").addEventListener("input", () => {
        render(applyFilters(allData));
    });

    document.getElementById("riskFilter").addEventListener("change", () => {
        render(applyFilters(allData));
    });

    /* WEBSOCKET (REAL-TIME) */
    const ws = new WebSocket("ws://localhost:8002/ws/fraud");

    ws.onmessage = (event) => {
        const newAlert = JSON.parse(event.data);
        allData.unshift(newAlert);
        render(applyFilters(allData));
    };

    /* INIT */ //impl
    load();
    setInterval(load, 5000); // fallback refresh
</script>

</body>
</html>
