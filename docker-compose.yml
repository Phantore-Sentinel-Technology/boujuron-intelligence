

services:

  # =========================
  # KAFKA / REDPANDA
  # =========================
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: boujuron-kafka
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  # =========================
  # POSTGRES
  # =========================
  postgres:
    image: postgres:15
    container_name: boujuron-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: boujuron
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  # =========================
  # EVENT INGESTION SERVICE
  # =========================
  ingestion:
    build: .
    container_name: boujuron-ingestion
    depends_on:
      - kafka
      - postgres
    env_file:
      - .env
    ports:
    - "8000:8000"
    command: uvicorn services.event_ingestion_service.main:app --host 0.0.0.0 --port 8000
    restart: always

  # =========================
  # RISK ENGINE
  # =========================
  risk_engine:
    build: .
    container_name: boujuron-risk-engine
    depends_on:
      - kafka
      - postgres
    env_file:
      - .env
    ports:
    - "8001:8000"
    command: uvicorn services.risk_engine_service.main:app --host 0.0.0.0 --port 8000
    restart: always

  # =========================
  # EVENT CONSUMER
  # =========================
  consumer:
    build: .
    container_name: boujuron-consumer
    depends_on:
      - kafka
      - postgres
    env_file:
      - .env
    command: python -u infrastructure/kafka_consumer/consumer.py
    restart: always

  # =========================
  # FRAUD ALERT SERVICE
  # =========================
  fraud_alert:
    build: .
    container_name: boujuron-fraud-alert
    depends_on:
      - kafka
      - postgres
    env_file:
      - .env
    ports:
    - "8003:8000"
    command: python infrastructure/fraud_alert_service/alert_consumer.py
    restart: always

  # =========================
  # DASHBOARD API
  # =========================
  dashboard:
    build: .
    container_name: boujuron-dashboard
    depends_on:
      - kafka
      - postgres
    env_file:
      - .env
    ports:
      - "8002:8000"
    command: uvicorn services.dashboard_service.main:app --host 0.0.0.0 --port 8000
    restart: always

  volumes:
  postgres_data: